<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISTCampusConnect | AI Chatbot</title>
    <meta name="description" content="CampusConnect AI Chatbot - Get all your college-related questions answered instantly.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar or Side Info -->
        <aside class="sidebar">
            <div class="logo-container">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <h1 class="logo-text">NISTCampusConnect</h1>
            </div>
            <div class="sidebar-info">
                <h2>Your AI Campus Assistant</h2>
                <p>Ask me anything about:</p>
                <ul class="topics-list">
                    <li><i class="fa-solid fa-file-signature"></i> Admissions</li>
                    <li><i class="fa-solid fa-building-columns"></i> Academics</li>
                    <li><i class="fa-solid fa-indian-rupee-sign"></i> Fees & Scholarships</li>
                    <li><i class="fa-solid fa-bed"></i> Hostel Facilities</li>
                    <li><i class="fa-solid fa-briefcase"></i> Placements</li>
                </ul>
            </div>
            <div class="status-indicator">
                <span class="pulse"></span> System Online
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <div class="agent-info">
                    <div class="agent-avatar">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="agent-details">
                        <h2>CampusBot</h2>
                        <span class="typing-indicator" id="typing-indicator" style="display: none;">Typing...</span>
                    </div>
                </div>
            </header>

            <div class="chat-messages" id="chat-messages">
                <!-- Initial Welcome Message -->
                <div class="message bot-message">
                    <div class="message-content">
                        Hi there! 👋 I'm CampusBot, your digital assistant for the college. How can I help you today?
                    </div>
                </div>
                
                <div class="suggestions-container" id="suggestions">
                    <button class="suggestion-chip">What is the fee for B.Tech?</button>
                    <button class="suggestion-chip">How are the placements?</button>
                    <button class="suggestion-chip">Tell me about hostel facilities</button>
                    <button class="suggestion-chip">What is the admission process?</button>
                </div>
            </div>

            <div class="chat-input-container">
                <form id="chat-form" class="chat-form">
                    <input type="text" id="user-input" placeholder="Type your question here..." autocomplete="off" required>
                    <button type="submit" id="send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
